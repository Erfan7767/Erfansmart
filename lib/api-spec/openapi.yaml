openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Erfan AI chat
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/completions:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: Generate an Erfan chat response
      description: Sends recent user and assistant messages to the configured free-tier LLM provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionInput"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
        "400":
          description: Invalid messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionError"
        "429":
          description: Free-tier request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionError"
        "502":
          description: Provider returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionError"
        "503":
          description: LLM provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]
    ChatCompletionInput:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/ChatMessage"
      required: [messages]
    ChatCompletion:
      type: object
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 8000
        model:
          type: string
      required: [reply, model]
    ChatCompletionError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

